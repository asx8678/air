[package]
name = "low"
version = "0.1.2"
edition = "2024"
rust-version = "1.99"
description = "A low-entropy, code-mode coding agent: one sandboxed Python tool, verified diffs, git as the undo"
license = "MIT"
repository = "https://github.com/asx8678/low"
readme = "README.md"
keywords = ["agent", "llm", "coding-agent", "cli", "sandbox"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**/*", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rustyline = "18.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["io-util", "macros", "process", "rt", "signal", "time"] }
toml = "1.1.8"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
